name: Update system CI
on:
  push:
    paths: ["node-app/update-system/**", "node-app/test/update-system.test.js", "node-app/scripts/*update*", "deploy/update-center/**", ".github/workflows/update-system-ci.yml"]
  pull_request:
    paths: ["node-app/update-system/**", "node-app/test/update-system.test.js", "node-app/scripts/*update*", "deploy/update-center/**"]
jobs:
  test:
    runs-on: windows-latest
    defaults: { run: { working-directory: node-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: node-app/package-lock.json }
      - run: npm ci
      - run: node --test test/update-system.test.js
      - run: npm run build
      - run: npm run build:update-center
      - run: node scripts/bundle-updater.js build/updater/agent.mjs

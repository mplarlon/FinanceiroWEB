services:
  update-center:
    build:
      context: ../..
      dockerfile: deploy/update-center/Dockerfile
    restart: unless-stopped
    env_file: ${UPDATE_CENTER_ENV_FILE:-.env}
    environment:
      UPDATE_CENTER_DATA_DIR: /var/lib/erp-update-center
      UPDATE_SIGNING_PUBLIC_KEY_FILE: /run/secrets/release-public.pem
    volumes:
      - update_data:/var/lib/erp-update-center
      - ./secrets/release-public.pem:/run/secrets/release-public.pem:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file: ${UPDATE_CENTER_ENV_FILE:-.env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on:
      update-center:
        condition: service_healthy
networks:
  internal:
volumes:
  update_data:
  caddy_data:
  caddy_config:
